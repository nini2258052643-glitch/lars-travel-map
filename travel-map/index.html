<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LARS / IN TRANSIT</title>

    <!-- 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- D3 -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

<main id="app">

    <!-- =========================
         PAGE 1
         首页
    ========================== -->

    <section
        id="home-page"
        class="page active"
    >

        <div class="project-name">
            LARS / IN TRANSIT
        </div>

        <div class="project-time">
            2026 — PRESENT
        </div>


        <div class="home-content">

            <h1>
                Lars的城市日记
            </h1>


            <div class="intro-text">

                <p>
                    飞行意味着自由与可能性
                </p>

                <p>
                    停留、离开，<br>
                    尾翼在不同城市留下痕迹
                </p>

                <p>
                    继而振翅到达向往的「远方」
                </p>

            </div>


            <button
                id="enter-map"
                class="enter-button"
            >

                <span>
                    ENTER MAP
                </span>

                <strong>
                    →
                </strong>

            </button>

        </div>


        <div class="page-number">
            01 / 02
        </div>

    </section>



    <!-- =========================
         PAGE 2
         中国地图
    ========================== -->

    <section
        id="map-page"
        class="page"
    >

        <header class="map-header">

            <div class="project-name">
                LARS / IN TRANSIT
            </div>

            <button
                id="back-home"
                class="back-button"
            >
                ← BACK
            </button>

        </header>



        <!--
            这里不是一个灰色地图框。
            它只是负责裁切地图和接收拖拽/缩放。
            本身完全透明。
        -->

        <div
            id="map-frame"
            class="map-frame"
        >

            <div
                id="map-viewport"
                class="map-viewport"
            >

                <svg
                    id="china-map"
                ></svg>

            </div>

        </div>



        <!-- =========================
             城市日记
        ========================== -->

        <aside
            id="place-panel"
            class="place-panel"
        >

            <button
                id="close-place"
                class="close-place"
            >
                ×
            </button>


            <div class="place-label">
                CITY DIARY
            </div>


            <h2 id="place-title">
                杭州
            </h2>


            <div
                id="place-location"
                class="place-location"
            >
                ZHEJIANG / CHINA
            </div>


            <div class="place-line"></div>


            <div
                id="place-description"
                class="place-description"
            >
                这里将放置 Lars 关于杭州的私人记忆。
            </div>


            <div class="place-date">
                DATE / —
            </div>

        </aside>



        <!-- 操作提示 -->

        <div class="map-hint">

            SCROLL TO ZOOM

            <span>
                ·
            </span>

            DRAG TO MOVE

        </div>


        <!-- 页码 -->

        <div class="map-page-number">
            02 / 02
        </div>

    </section>

</main>



<!-- =========================
     鸟
========================== -->

<div class="bird-cursor">

    <svg
        width="42"
        height="32"
        viewBox="0 0 42 32"
        xmlns="http://www.w3.org/2000/svg"
    >

        <path
            d="
                M2 17
                C8 7, 15 5, 20 12
                C24 5, 32 3, 40 7
                C34 9, 30 13, 27 18
                C23 25, 15 28, 8 25
                C12 23, 14 20, 15 17
                C10 19, 6 19, 2 17Z
            "
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
        />

        <circle
            cx="32"
            cy="9"
            r="1.3"
            fill="currentColor"
        />

    </svg>

</div>



<!-- JS -->

<script src="script.js"></script>

</body>

</html>
